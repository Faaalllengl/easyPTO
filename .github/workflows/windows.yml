name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Install NSIS
        if: github.event_name != 'pull_request'
        run: choco install nsis --yes --no-progress
      - name: Prepare updater signing key file
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_SECRET)) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret before building an installer.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'easypto-updater.key'
          $keyMaterial = $env:TAURI_SIGNING_PRIVATE_KEY_SECRET -replace '\s', ''
          [System.IO.File]::WriteAllText($keyPath, $keyMaterial, [System.Text.UTF8Encoding]::new($false))
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
      - name: Build Windows installer
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: easypto-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
